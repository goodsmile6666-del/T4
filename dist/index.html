<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="정부 안내서비스를 검색하고 분야, 소관기관, 온라인 안내 여부로 찾아보세요.">
    <meta name="theme-color" content="#075985">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23075985'/%3E%3Cpath d='M18 20h28v24H18z' fill='white'/%3E%3Cpath d='m24 32 5 5 11-12' fill='none' stroke='%230e7490' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <title>정부 안내서비스 찾기</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <a class="skip-link" href="#service-list">검색 결과 바로가기</a>

    <header class="site-header">
      <div class="site-header__inner">
        <a class="brand" href="#top" aria-label="정부 안내서비스 찾기 처음으로">
          <span class="brand__symbol" aria-hidden="true">안내</span>
          <span>정부 안내서비스 찾기</span>
        </a>
        <span class="data-note">총 24개 서비스</span>
      </div>
    </header>

    <main id="top">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">생활에 필요한 정부 안내</p>
        <h1 id="page-title">어떤 안내서비스를 찾으세요?</h1>
        <p class="intro__text">서비스명을 검색하거나 안내분야를 선택해 빠르게 찾아보세요.</p>

        <form id="filters" class="search-surface" role="search">
          <div class="search-field">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.4-4.4m2.4-5.6a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z" /></svg>
            <label class="visually-hidden" for="query">서비스명 검색</label>
            <input id="query" type="search" placeholder="서비스명 검색 (예: 연금, 교육)" autocomplete="off">
          </div>

          <div class="filter-row">
            <div class="select-field">
              <label for="category">안내 분야</label>
              <select id="category">
                <option value="">전체 분야</option>
              </select>
            </div>
            <div class="select-field">
              <label for="agency">소관기관</label>
              <select id="agency">
                <option value="">전체 기관</option>
              </select>
            </div>
            <div class="select-field">
              <label for="online">온라인 안내</label>
              <select id="online">
                <option value="">전체</option>
                <option value="가능">가능</option>
                <option value="불가">불가</option>
              </select>
            </div>
            <button id="reset" class="reset-button" type="button">조건 초기화</button>
          </div>
        </form>
      </section>

      <section class="results" aria-labelledby="results-title">
        <div class="results__header">
          <div>
            <p class="results__label">검색 결과</p>
            <h2 id="results-title"><span id="result-count">0</span>개의 서비스를 찾았습니다</h2>
          </div>
          <p id="active-filter" class="active-filter" aria-live="polite">전체 서비스를 표시합니다.</p>
        </div>

        <div id="service-list" class="service-grid" aria-live="polite" aria-busy="true">
          <div class="status-card">서비스 목록을 불러오는 중입니다.</div>
        </div>
      </section>
    </main>

    <footer>
      <p>첨부된 안내서비스 목록을 기준으로 제공합니다.</p>
      <p>정부 안내서비스 찾기</p>
    </footer>

    <script src="app.js" defer></script>
  </body>
</html>
