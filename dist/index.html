<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="정부 안내서비스 24건을 서비스명과 안내분야로 빠르게 찾아보세요.">
  <meta name="theme-color" content="#123a63">
  <title>정부 안내서비스 찾기</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23123a63'/%3E%3Cpath d='M8 11h16M10 11v11m6-11v11m6-11v11M8 22h16M9 8h14l-7-3z' stroke='%23fff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#service-results">검색 결과로 건너뛰기</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#" aria-label="정부 안내서비스 찾기 홈">
        <span class="brand-mark" aria-hidden="true">안내</span>
        <span>정부 안내서비스 찾기</span>
      </a>
      <p class="header-note">필요한 안내를 한곳에서</p>
    </div>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <div class="eyebrow"><span aria-hidden="true"></span> 생활에 필요한 정부 안내</div>
      <h1 id="page-title">어떤 안내를<br>찾고 계신가요?</h1>
      <p>서비스 이름을 검색하거나 분야를 선택해 빠르게 확인하세요.</p>
    </section>

    <section class="finder" aria-label="안내서비스 검색 및 필터">
      <div class="search-wrap">
        <label for="service-search">서비스명 검색</label>
        <div class="search-field">
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
          <input id="service-search" type="search" placeholder="예: 기초연금, 운전면허" autocomplete="off">
          <button id="clear-search" class="clear-search" type="button" aria-label="검색어 지우기" hidden>지우기</button>
        </div>
      </div>

      <fieldset class="filter-wrap">
        <legend>안내분야</legend>
        <div id="category-filters" class="filter-list"></div>
      </fieldset>
    </section>

    <section id="service-results" class="results" aria-labelledby="results-heading">
      <div class="results-head">
        <div>
          <p class="section-kicker">안내서비스 목록</p>
          <h2 id="results-heading"><strong id="result-count">24</strong>건의 서비스를 찾았어요</h2>
        </div>
        <button id="reset-filters" class="reset-button" type="button">전체 초기화</button>
      </div>

      <div id="service-list" class="service-list" aria-live="polite" aria-busy="false"></div>

      <div id="empty-state" class="empty-state" hidden>
        <div class="empty-icon" aria-hidden="true">?</div>
        <h3>조건에 맞는 서비스가 없어요</h3>
        <p>검색어를 바꾸거나 다른 안내분야를 선택해 보세요.</p>
        <button id="empty-reset" type="button">전체 목록 보기</button>
      </div>
    </section>
  </main>

  <footer>
    <p>정부 안내서비스 목록 기준 · 총 24건</p>
    <p>온라인 안내와 콜센터 정보를 확인할 수 있습니다.</p>
  </footer>

  <template id="service-template">
    <article class="service-card">
      <div class="card-main">
        <div class="card-topline">
          <span class="category-badge"></span>
          <span class="service-id"></span>
        </div>
        <h3 class="service-name"></h3>
        <p class="agency"></p>
      </div>
      <dl class="contact-info">
        <div>
          <dt>온라인안내</dt>
          <dd class="online-status"></dd>
        </div>
        <div>
          <dt>콜센터</dt>
          <dd><a class="phone-number"></a></dd>
        </div>
      </dl>
    </article>
  </template>
</body>
</html>
